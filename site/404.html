<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiCart</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A3F86">
<!-- GitHub Pages shows this for any address that does not exist.
     WhatsApp links whose {{1}} was never filled in (and old or mistyped links) are sent to the right page instead of an error. -->
<script>
(function () {
  var parts = location.pathname.split('/');
  var base = /github\.io$/.test(location.hostname) && parts[1] ? '/' + parts[1] + '/' : '/';
  var path = decodeURIComponent(location.pathname.slice(base.length));
  var q = location.search.length > 1 ? '&' + location.search.slice(1) : '';
  var m = path.match(/watch-([a-z]+)/), to;
  if (/\{\{|\}\}/.test(path)) to = 'watch.html?src=wa' + q;           // template button sent without its {{1}}
  else if (m) to = 'watch.html?c=' + m[1] + q;                          // watch-fashion etc. with something extra
  else to = '';                                                         // anything else: home page
  location.replace(base + to + location.hash);
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A3F86;color:#fff;font:600 16px/1.4 system-ui,sans-serif}a{color:#FFB347}</style>
</head>
<body><p>Opening DigiCart… <a href="./">Tap here</a> if nothing happens.</p></body>
</html>
