# Publishes the "site" folder to GitHub Pages every time you upload changes.
# It also writes the website's own address into the WhatsApp preview tags (the __SITE__ placeholders).
# One-time: Settings → Pages → Source: GitHub Actions.
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Put the website address into the link previews
        run: |
          sed -i "s#__SITE__#${{ steps.pages.outputs.base_url }}#g" site/*.html
          grep -h 'og:image"' site/fashion.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
